drawPick();

const CFG=window.PAT_CONFIG||{};let sb=null,ch=null;

  loadSB().then(()=>{sb=sb||window.supabase.createClient(CFG.url,CFG.key);const chn=sb.channel('room-'+c,{config:{broadcast:{self:false}}});chn.on('broadcast',{event:'m'},p=>onMsg(p.payload)).subscribe(st=>{if(st==='SUBSCRIBED'){ch=chn;net=chn;$('#msg').textContent='';ready&&ready()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){$('#msg').textContent='Can\u2019t reach the game server. Check your connection and try again.'}})}).catch(()=>{$('#msg').textContent='Couldn\u2019t load multiplayer. Check your connection.'});return true}

function onMsg(m){if(m.p===slot)return;

function missionTick(){missions.forEach(m=>{if(!m.d&&m.f()){m.d=1;dMsg='Mission done: '+m.t;dMsgT=T;sfx.level()}})}
function drawMissions(){g.save();g.textAlign='left';g.font='700 12px Nunito,sans-serif';g.shadowColor='rgba(47,58,43,.8)';g.shadowBlur=4;missions.forEach((m,i)=>{g.fillStyle=m.d?'#CFE5B4':'#FFF8EB';g.fillText((m.d?'✓ ':'○ ')+m.t,12,SAT()+74+i*16)});g.restore()}
function puff(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*120,l:.6+Math.random()*.4,c})}
function partsTick(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;if(p.l<=0)parts.splice(i,1)}if(me.st==='air'&&Math.random()<.7)parts.push({x:me.x,y:me.y-14,vx:0,vy:20,l:.45,c:PETAL[Math.floor(Math.random()*6)]})}
function drawParts(){parts.forEach(p=>{g.globalAlpha=Math.max(0,Math.min(1,p.l/.5));g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()});g.globalAlpha=1}
function mountains(){[[.8,'rgba(63,90,58,.28)',70,.012,.1],[.92,'rgba(47,70,45,.36)',45,.02,.18]].forEach(l=>{const yy=H*l[0]+Math.max(0,cam)*l[4];if(yy>H+l[2]*2)return;g.fillStyle=l[1];g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+20;x+=20)g.lineTo(x,yy-Math.abs(Math.sin(x*l[3]*3+l[0]*9))*l[2]-Math.sin(x*l[3])*l[2]*.5);g.lineTo(W,H);g.fill()})}
function movers(dt){const mx=Math.max(me.isl,pb?pb.isl:0)+8;for(let j=Math.max(0,me.isl-5);j<=mx;j++){const s=I(j);if(s.m){const nx=s.bx+s.m*Math.sin(T*s.sp+s.ph);s.dx=nx-s.x;s.x=nx}else s.dx=0}
 if(me.st==='stand')me.x+=I(me.isl).dx||0;if(pb&&pb.st==='stand')pb.x+=I(pb.isl).dx||0}
function hazTick(dt){if(me.inv>0)me.inv-=dt;if(thOver||typing)return;const nh=hzInfo(me.isl+1);if(nh&&!hintH&&me.st==='stand'){hintH=1;dMsg='Time your hop: dodge the flyer!';dMsgT=T}
 if(me.st!=='air'||me.inv>0)return;for(let j=Math.max(1,me.isl);j<=me.isl+6;j++){const h=hzInfo(j);if(!h)continue;const hx=h.A*Math.sin(T*h.sp+h.ph),hy=-(j+.5)*GAP;if(Math.hypot(me.x-hx,(me.y-18)-hy)<26){if(me.shield){me.shield=0;me.inv=.8;sfx.pop();dMsg='Shield blocked it!';dMsgT=T}else{me.inv=1.3;hurtMe()}return}}}
function drawExtras(s,i){g.textAlign='center';g.textBaseline='middle';
 if(padOn(i)){g.font=EF(34);g.fillText('🍄',s.x,s.y-18+Math.sin(T*6+i)*2)}
 const pu=puInfo(i);if(pu&&!puGot.has(i)){g.font=EF(28);g.fillText(PUE[pu],s.x+s.hw*.35,s.y-42+Math.sin(T*3+i)*5)}
 const hz=hzInfo(i);if(hz){const hx=hz.A*Math.sin(T*hz.sp+hz.ph),hy=-(i+.5)*GAP;g.save();g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=2;g.setLineDash([4,8]);g.beginPath();g.moveTo(-hz.A,hy);g.lineTo(hz.A,hy);g.stroke();g.restore();g.font=EF(30);g.fillText(hz.e,hx,hy)}
 g.textBaseline='alphabetic'}
function climbLand(j){const b=me;puff(b.x,b.y,10,'#CFE5B4');
 if(j>lastIsl){combo=(T-lastLand<2.4&&lastIsl>=0)?Math.min(5,combo+1):1;cscore+=10*combo*(boostT>T?2:1)+(j%5===0?25:0);lastIsl=j;maxCombo=Math.max(maxCombo,combo);if(combo>=3){dMsg='Combo x'+combo+'!';dMsgT=T;sfx.coin()}}
 lastLand=T;
 const pu=puInfo(j);let auto=false;
 if(pu&&!puGot.has(j)){puGot.add(j);if(pu==='heart'){if(lives<8){lives++;send({t:'heal'})}dMsg='Extra heart!'}else if(pu==='shield'){me.shield=1;dMsg='Shield ready!'}else if(pu==='boost'){boostT=T+15;dMsg='Score x2 for 15 seconds!'}else{dMsg='Balloon! Up we go!';auto=true;setTimeout(()=>{if(me.st==='stand'&&mode==='play'&&me.isl===j)launch(5,2.2,me.gv)},200)}dMsgT=T;sfx.power()}
 else if(!pu&&padOn(j)){auto=true;dMsg='Spring pad!';dMsgT=T;sfx.pop();setTimeout(()=>{if(me.st==='stand'&&mode==='play'&&me.isl===j)launch(3,1.5,me.gv)},150)}
 if(!auto&&me.buf&&T-me.buf<.35){me.buf=0;setTimeout(hop,40)}
 missionTick()}
$('#snd').onclick=()=>{muted=!muted;$('#snd').textContent=muted?'🔇':'🔊'};
$('#th').onclick=()=>{const ks=Object.keys(TH);theme=myCfg.theme=ks[(ks.indexOf(theme)+1)%ks.length];try{localStorage.setItem('pat',JSON.stringify(myCfg))}catch(e){}};
const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#jr').onclick=()=>{const L=[...E.values()].filter(e=>e.s===slot&&!e.auto).sort((a,b)=>a.j-b.j);$('#jlist').innerHTML=L.length?L.map(e=>`<p><b>${esc(e.w)}</b> ${e.mood?(MD.find(m=>m[0]===e.mood)||[])[1]||'':''}${e.note?'<br>'+esc(e.note):''}</p>`).join(''):'<p>Nothing planted yet.</p>';$('#jpanel').classList.remove('hide')};
$('#jclose').onclick=()=>$('#jpanel').classList.add('hide');
requestAnimationFrame(frame);
</script></body></html>
