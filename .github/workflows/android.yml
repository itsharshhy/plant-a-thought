name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir -p www
          cp -r index.html config.js vendor icons www/

      - run: npm install
      - run: npx cap add android

      - name: App icons
        run: npx --yes @capacitor/assets generate --android
        continue-on-error: true

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlantAThought.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlantAThought-apk
          path: PlantAThought.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PlantAThought.apk
